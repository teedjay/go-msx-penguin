# Disassembler config: addresses and names only, never ROM data.
# See internal/z80dis/config.go for the directives.

entry $4010 INIT            # cartridge header INIT
entry $4045 IRQ             # installed in H.KEYI by INIT

# Computed-jump trampoline: ADD A,A / POP HL / index / JP (HL). Each CALL
# to it is followed by a DW table indexed by A; the CALL never returns.
inline $409A
label $409A JPTAB
label $48D3 ADDHLA          # HL += A

# Unreferenced code: no CALL/JP and no 16-bit word anywhere in the ROM
# points at these. Development leftovers; never reached. Listed only so the
# listing decodes them.
entry $4401 dead4401
entry $4442 dead4442
entry $48AE dead48AE        # VRAM read twin of $48A5 (uses port byte $0007)

# VDP helpers. Note the port bytes are used swapped relative to the BIOS
# docs: the write path reads $0006, the read path $0007 (both $98 on real
# machines).
label $48A5 VWRBYTE         # A -> VRAM[DE]
label $48B7 VSETWR          # SETWRT on DE, C = port from $0006
label $48C6 VSETRD          # SETRD on DE, C = port from $0007

data $4000-$400F cartridge header
data $44BF-$44C6 VDP R0-R7 initial values
data $4EC2-$4ED5 small signed-offset table (not yet traced)
